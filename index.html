<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoRich Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0c0d;
            --card-bg: #151719;
            --accent-green: #00ffa3;
            --text-main: #ffffff;
            --text-sub: #8b8e92;
            --red: #ff4d4d;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Pretendard', -apple-system, sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .container { max-width: 1000px; width: 100%; }

        /* Header */
        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; padding-bottom: 10px;
            border-bottom: 1px solid #2a2d31;
        }
        .logo-area { display: flex; flex-direction: column; align-items: flex-start; }
        .logo-img { height: 45px; width: auto; display: block; margin-bottom: 5px; }
        #live-status { font-size: 12px; font-weight: bold; color: var(--accent-green); }
        #live-status.error { color: var(--red); }

        /* Summary Grid */
        .summary-grid {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 15px; margin-bottom: 25px;
        }
        .summary-card {
            background: var(--card-bg); padding: 20px;
            border-radius: 12px; border: 1px solid #2a2d31;
        }
        .summary-card .label { color: var(--text-sub); font-size: 12px; margin-bottom: 8px; }
        .summary-card .value { font-size: 24px; font-weight: bold; }

        /* Main Grid */
        .main-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 15px; margin-bottom: 25px;
        }
        .content-card {
            background: var(--card-bg); padding: 20px;
            border-radius: 12px; min-height: 300px; border: 1px solid #2a2d31;
        }
        .card-header {
            display: flex; justify-content: space-between;
            margin-bottom: 20px; border-bottom: 1px solid #2a2d31;
            padding-bottom: 10px; font-size: 14px; font-weight: bold;
        }
        .badge {
            font-size: 10px; padding: 2px 8px; border-radius: 10px;
            background: #1e2124; color: var(--text-sub); font-weight: normal;
        }

        /* Table */
        table { width: 100%; border-collapse: collapse; }
        td { padding: 11px 0; font-size: 13px; border-bottom: 1px solid #1e2124; }
        td:last-child { text-align: right; font-weight: bold; }
        .up   { color: var(--accent-green); }
        .down { color: var(--red); }
        .hold { color: #f0a500; }
        .sub  { color: var(--text-sub); font-size: 11px; }

        /* Loading / Error */
        .msg-row td { color: var(--text-sub); font-size: 12px; text-align: center; padding: 40px 0; }

        /* Footer */
        footer {
            margin-top: 40px; padding-top: 20px;
            border-top: 1px solid #2a2d31;
            display: flex; justify-content: space-between; align-items: center;
        }
        .footer-text { color: var(--text-sub); font-size: 12px; }

        @media (max-width: 640px) {
            .summary-grid { grid-template-columns: repeat(2, 1fr); }
            .main-grid    { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">

    <header>
        <div class="logo-area">
            <img src="./logo.png" alt="AlgoRich" class="logo-img"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <h1 style="display:none; color:var(--accent-green); margin:0; font-size:28px;">AlgoRich</h1>
            <p style="color:var(--text-sub); margin:0; font-size:12px;">algorich.everyoungrich.com</p>
        </div>
        <div id="live-status">● SYSTEM LIVE</div>
    </header>

    <div class="summary-grid">
        <div class="summary-card">
            <div class="label">오늘 주도주 스캔</div>
            <div class="value" id="scan-count">-</div>
        </div>
        <div class="summary-card">
            <div class="label">현재 보유 종목</div>
            <div class="value" id="holding-count">-</div>
        </div>
        <div class="summary-card">
            <div class="label">이달 누적 수익률</div>
            <div class="value up" id="monthly-profit">-%</div>
        </div>
        <div class="summary-card">
            <div class="label">알고리즘 상태</div>
            <div class="value" style="font-size:16px; color:var(--accent-green)">ACTIVE</div>
        </div>
    </div>

    <div class="main-grid">
        <div class="content-card">
            <div class="card-header">
                <span>실시간 주도주 Log</span>
                <span class="badge" id="lead-badge">최신 5건</span>
            </div>
            <table id="lead-stock-table">
                <tr class="msg-row"><td colspan="2">데이터 로딩 중...</td></tr>
            </table>
        </div>
        <div class="content-card">
            <div class="card-header">
                <span>최근 매매 내역</span>
                <span class="badge" id="trade-badge">최신 5건</span>
            </div>
            <table id="trade-log-table">
                <tr class="msg-row"><td colspan="2">데이터 로딩 중...</td></tr>
            </table>
        </div>
    </div>

    <footer>
        <div style="display:flex; align-items:center; gap:10px;">
            <img src="./logo.png" alt="AlgoRich" style="height:25px; width:auto; opacity:0.8;"
                 onerror="this.style.display='none';">
            <span class="footer-text"><strong>AlgoRich Dashboard</strong> | Powered by EverYoungRich</span>
        </div>
        <span class="footer-text" id="last-update">업데이트 확인 중...</span>
    </footer>

</div>

<script>
    // 주도주 Log — 0_주도주_Log 탭
    const LEAD_CSV_URL  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRSUtXRGORylv3kPfUuzrl9RtNyS-okxqGLqGc7f18aF6H3ycFwNwq-_OlZIUN6QwJVoszvWKwxZNPh/pub?gid=1222820839&single=true&output=csv';
    // 매매일지 — 1D-Rebound 탭
    const TRADE_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSqu0fljAyaRMgIgpKO37r9VxiBQJXoBPLZVg8k31u8L5R8vAxtmGqajSFAcZcfL7DWYy449VNfCNsc/pub?gid=1786490570&single=true&output=csv';

    // CSV 파서 — 쉼표 포함 필드(따옴표 처리) 대응
    function parseCsv(text) {
        const rows = [];
        const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
        for (const line of lines) {
            if (!line.trim()) continue;
            const cols = [];
            let cur = '', inQuote = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (ch === '"') {
                    if (inQuote && line[i + 1] === '"') { cur += '"'; i++; }
                    else inQuote = !inQuote;
                } else if (ch === ',' && !inQuote) {
                    cols.push(cur.trim()); cur = '';
                } else {
                    cur += ch;
                }
            }
            cols.push(cur.trim());
            rows.push(cols);
        }
        return rows;
    }

    // 오늘 날짜 YYYY-MM-DD
    function today() {
        const d = new Date();
        return d.getFullYear() + '-' +
               String(d.getMonth() + 1).padStart(2, '0') + '-' +
               String(d.getDate()).padStart(2, '0');
    }

    // XSS 방지
    function esc(str) {
        return String(str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // 메인 업데이트
    async function updateDashboard() {
        try {
            const [leadRes, tradeRes] = await Promise.all([
                fetch(LEAD_CSV_URL),
                fetch(TRADE_CSV_URL)
            ]);
            if (!leadRes.ok)  throw new Error('주도주 Log 로딩 실패 (' + leadRes.status + ')');
            if (!tradeRes.ok) throw new Error('매매일지 로딩 실패 (' + tradeRes.status + ')');

            const leadRows  = parseCsv(await leadRes.text()).slice(1);   // 헤더 제외
            const tradeRows = parseCsv(await tradeRes.text()).slice(1);  // 헤더 제외

            renderLeadStocks(leadRows);
            renderTrades(tradeRows);

            document.getElementById('live-status').textContent = '● SYSTEM LIVE';
            document.getElementById('live-status').className   = '';
            document.getElementById('last-update').textContent =
                'Last Updated: ' + new Date().toLocaleTimeString('ko-KR');

        } catch (e) {
            console.error('Data Sync Error:', e);
            document.getElementById('live-status').textContent = '● SYNC ERROR';
            document.getElementById('live-status').className   = 'error';
            document.getElementById('last-update').textContent = '로딩 실패: ' + e.message;
        }
    }

    // 주도주 Log 렌더링
    // 컬럼: 날짜(0) 종목코드(1) 종목명(2) 종가(3) 상승률%(4) 거래대금억(5) 순위(6) 비고(7)
    function renderLeadStocks(rows) {
        const todayStr  = today();
        const todayRows = rows.filter(r => r[0] === todayStr);
        const display   = todayRows.length > 0 ? todayRows : rows.slice(-5).reverse();

        document.getElementById('scan-count').textContent =
            todayRows.length > 0 ? todayRows.length : '-';
        document.getElementById('lead-badge').textContent =
            todayRows.length > 0 ? '오늘 ' + todayRows.length + '건' : '최신 5건';

        if (display.length === 0 || !display[0][0]) {
            document.getElementById('lead-stock-table').innerHTML =
                '<tr class="msg-row"><td colspan="2">기록된 데이터가 없습니다.</td></tr>';
            return;
        }

        document.getElementById('lead-stock-table').innerHTML = display.map(r => {
            const rate = parseFloat(r[4]) || 0;
            const cls  = rate >= 0 ? 'up' : 'down';
            const sign = rate >= 0 ? '+' : '';
            return `<tr>
                <td>
                    <div>${esc(r[2])}</div>
                    <div class="sub">${esc(r[1])} &middot; ${esc(r[0])}</div>
                </td>
                <td class="${cls}">
                    ${sign}${rate.toFixed(2)}%<br>
                    <span class="sub" style="font-weight:normal">${Number(r[3]||0).toLocaleString()}원</span>
                </td>
            </tr>`;
        }).join('');
    }

    // 매매일지 렌더링
    // 컬럼: Trade ID(0) 상태(1) 종목코드(2) 종목명(3) 매수일자(4) 매수단가(5)
    //       매수수량(6) 투자금액(7) 매도일자(8) 매도단가(9) 수익률%(10) 수익금(11) 비고(12)
    function renderTrades(rows) {
        const holding = rows.filter(r => r[1] === '보유');
        document.getElementById('holding-count').textContent = holding.length;

        // 이달 완료 거래 평균 수익률
        const thisMonth = today().slice(0, 7);
        const monthDone = rows.filter(r => r[1] === '완료' && String(r[8]).startsWith(thisMonth));
        if (monthDone.length > 0) {
            const avg = monthDone.reduce((s, r) => s + (parseFloat(r[10]) || 0), 0) / monthDone.length;
            const el  = document.getElementById('monthly-profit');
            el.textContent = (avg >= 0 ? '+' : '') + avg.toFixed(2) + '%';
            el.className   = 'value ' + (avg >= 0 ? 'up' : 'down');
        }

        // 최신 5건 (완료 우선, 없으면 보유)
        const done    = rows.filter(r => r[1] === '완료').slice(-5).reverse();
        const display = done.length > 0 ? done : holding.slice(-5).reverse();

        document.getElementById('trade-badge').textContent = '최신 ' + display.length + '건';

        if (display.length === 0 || !display[0][0]) {
            document.getElementById('trade-log-table').innerHTML =
                '<tr class="msg-row"><td colspan="2">최근 매매 내역이 없습니다.</td></tr>';
            return;
        }

        document.getElementById('trade-log-table').innerHTML = display.map(r => {
            const isHold   = r[1] === '보유';
            const profitRt = parseFloat(r[10]) || 0;
            const cls      = isHold ? 'hold' : (profitRt >= 0 ? 'up' : 'down');
            const label    = isHold ? '보유 중' : (profitRt >= 0 ? '+' : '') + profitRt.toFixed(2) + '%';
            return `<tr>
                <td>
                    <div>${esc(r[3])}</div>
                    <div class="sub">${esc(r[2])}${r[4] ? ' &middot; 매수 ' + esc(r[4]) : ''}</div>
                </td>
                <td class="${cls}">
                    ${label}<br>
                    <span class="sub" style="font-weight:normal">${Number(r[5]||0).toLocaleString()}원</span>
                </td>
            </tr>`;
        }).join('');
    }

    // 최초 로딩 + 60초마다 자동 갱신
    updateDashboard();
    setInterval(updateDashboard, 60000);
</script>
</body>
</html>
