<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoRich Dashboard</title>
    <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg:      #0b0c0d;
            --card-bg: #151719;
            --green:   #00ffa3;
            --red:     #ff4d4d;
            --gold:    #f0a500;
            --blue:    #3b82f6;
            --orange:  #f97316;
            --fg:      #ffffff;
            --sub:     #8b8e92;
            --border:  #2a2d31;
            --row:     #1e2124;
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--fg);
            font-family: 'Pretendard', -apple-system, sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .container { max-width: 1000px; width: 100%; }

        /* ── Header ── */
        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .logo-area { display: flex; flex-direction: column; align-items: flex-start; }
        .logo-img  { height: 45px; width: auto; max-width: 180px; display: block; margin-bottom: 5px; object-fit: contain; }
        #live-status { font-size: 12px; font-weight: bold; color: var(--green); }
        #live-status.error { color: var(--red); }

        /* ── Summary ── */
        .summary-grid {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 15px; margin-bottom: 25px;
        }
        .summary-card {
            background: var(--card-bg); padding: 20px;
            border-radius: 12px; border: 1px solid var(--border);
        }
        .summary-card .label { color: var(--sub); font-size: 12px; margin-bottom: 8px; }
        .summary-card .value { font-size: 24px; font-weight: bold; }

        /* ── Main panels ── */
        .main-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 15px; margin-bottom: 25px;
        }
        .content-card {
            background: var(--card-bg); padding: 20px;
            border-radius: 12px; min-height: 300px; border: 1px solid var(--border);
        }
        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 10px;
            border-bottom: 1px solid var(--border); font-size: 14px; font-weight: bold;
        }
        .badge {
            font-size: 10px; padding: 2px 8px; border-radius: 10px;
            background: var(--row); color: var(--sub); font-weight: normal;
        }
        .badge.active { background: #0d2e1f; color: var(--green); }

        /* ── Tables ── */
        table { width: 100%; border-collapse: collapse; }
        td { padding: 10px 0; font-size: 13px; border-bottom: 1px solid var(--row); }
        td:last-child { text-align: right; font-weight: bold; }
        .up   { color: var(--green); }
        .down { color: var(--red); }
        .sub  { color: var(--sub); font-size: 11px; margin-top: 2px; }
        .star { color: var(--gold); font-size: 12px; margin-left: 3px; }
        .msg-row td { color: var(--sub); font-size: 12px; text-align: center; padding: 40px 0; }
        .tag-watch {
            display: inline-block; font-size: 10px; padding: 2px 7px;
            border-radius: 8px; background: #2e2000; color: var(--gold); font-weight: bold;
        }
        /* 관심종목 행 hover */
        #lead-stock-table table tr { cursor: pointer; transition: background 0.15s; }
        #lead-stock-table table tr:hover td { background: #1a1d20; }

        /* 날짜 그룹 헤더 */
        .date-group { margin-top: 16px; }
        .date-group:first-child { margin-top: 0; }
        .date-group-hdr {
            display: flex; align-items: center; gap: 7px;
            padding-bottom: 7px; margin-bottom: 2px;
            font-size: 11px; font-weight: 700;
            color: var(--green); letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
        }
        .date-group-hdr .dg-line {
            flex: 1; height: 1px; background: var(--border);
        }

        /* ── 전략 섹션 ── */
        .strat-section { margin-bottom: 18px; }
        .strat-head {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; padding: 6px 0;
            border-bottom: 1px solid var(--border);
            font-size: 12px; font-weight: bold;
        }
        .strat-name { color: var(--fg); }
        .badge-live    { background: #0d2e1f; color: var(--green); }
        .badge-planned { background: #1e1a0d; color: var(--gold); }
        .strat-empty { color: var(--sub); font-size: 11px; padding: 8px 0 4px 2px; }

        /* ── Footer ── */
        footer {
            margin-top: 40px; padding-top: 20px;
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .footer-text { color: var(--sub); font-size: 12px; }

        /* ── Chart Modal ── */
        #chart-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 1000;
            align-items: center; justify-content: center;
            padding: 16px;
        }
        #chart-box {
            background: #111315; border-radius: 16px;
            border: 1px solid var(--border);
            width: 900px; max-width: 98vw;
            max-height: 92vh; overflow-y: auto;
            display: flex; flex-direction: column;
        }
        /* 헤더 */
        #modal-header { padding: 20px 24px 14px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
        .modal-title-row {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 10px;
        }
        .modal-name { font-size: 20px; font-weight: 700; }
        .modal-code-row { display: flex; align-items: center; gap: 8px; margin-top: 5px; flex-wrap: wrap; }
        .modal-code { font-size: 13px; color: var(--sub); }
        .modal-market { font-size: 10px; padding: 2px 7px; border-radius: 5px; font-weight: 700; }
        #chart-close {
            background: none; border: none; color: var(--sub);
            font-size: 28px; cursor: pointer; line-height: 1; padding: 0; flex-shrink: 0;
        }
        #chart-close:hover { color: var(--fg); }
        .modal-price-row { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
        .modal-price  { font-size: 30px; font-weight: 700; }
        .modal-change { font-size: 15px; }
        /* 52주 range bar */
        .range-wrap { display: flex; align-items: center; gap: 10px; }
        .range-label { font-size: 11px; color: var(--sub); white-space: nowrap; }
        .range-bar { flex: 1; height: 4px; border-radius: 2px; background: var(--border); position: relative; min-width: 60px; }
        .range-thumb {
            position: absolute; top: -3px;
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--green); transform: translateX(-50%); transition: left 0.3s;
        }
        /* 차트 */
        #modal-chart-section { padding: 0 24px; flex-shrink: 0; }
        #chart-tabs { display: flex; gap: 4px; padding: 12px 0 8px; }
        .chart-tab {
            background: none; border: 1px solid var(--border);
            color: var(--sub); font-size: 12px; padding: 4px 14px;
            border-radius: 6px; cursor: pointer; transition: all 0.15s;
        }
        .chart-tab:hover  { border-color: var(--green); color: var(--green); }
        .chart-tab.active { background: var(--green); border-color: var(--green); color: #000; font-weight: 700; }
        #chart-wrap { width: 100%; height: 300px; position: relative; }
        #chart-msg  {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            color: var(--sub); font-size: 13px;
        }
        /* 하단: 기본정보 + 수급 */
        #modal-bottom {
            display: grid; grid-template-columns: 1fr 1fr;
            padding: 16px 24px 20px; border-top: 1px solid var(--border);
        }
        .modal-section-title {
            font-size: 10px; font-weight: 700; color: var(--sub);
            letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 10px;
        }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 20px; }
        .info-item { display: flex; flex-direction: column; gap: 2px; }
        .info-label { font-size: 10px; color: var(--sub); }
        .info-val   { font-size: 13px; font-weight: 600; }
        #modal-supply { padding-left: 20px; border-left: 1px solid var(--border); }
        .supply-row {
            display: flex; justify-content: space-between; align-items: flex-start;
            padding: 7px 0; border-bottom: 1px solid var(--row);
        }
        .supply-row:last-child { border-bottom: none; }
        .supply-label  { font-size: 12px; color: var(--sub); width: 50px; flex-shrink: 0; padding-top: 2px; }
        .supply-val    { font-size: 13px; font-weight: 700; }
        .supply-detail { font-size: 10px; color: var(--sub); margin-top: 3px; }
        .badge-52h {
            font-size: 11px; padding: 2px 8px; border-radius: 8px;
            background: rgba(255,77,77,0.15); color: var(--red);
            border: 1px solid rgba(255,77,77,0.3); font-weight: bold;
        }
        @media (max-width: 700px) {
            #modal-bottom { grid-template-columns: 1fr; }
            #modal-supply { padding-left: 0; border-left: none; padding-top: 16px; border-top: 1px solid var(--border); }
        }

        @media (max-width: 640px) {
            .summary-grid { grid-template-columns: repeat(2, 1fr); }
            .main-grid    { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">

    <header>
        <div class="logo-area">
            <img src="./logo.png" alt="AlgoRich" class="logo-img"

    <div class="summary-grid">

<!-- ── 종목 상세 모달 ── -->
<div id="chart-overlay">
    <div id="chart-box">

        <!-- 헤더 -->
        <div id="modal-header">

<script>
// ── 설정 ────────────────────────────────────────────────────────────
// Apps Script 배포 URL — 배포 후 아래에 입력
const CHART_API_URL = 'https://script.google.com/macros/s/AKfycbzLx083Igw4x5jxR2ndLqtpZ_-SeuZALdUXO5qc7EDKEn_nqttruvKrA5cV9RUsPyoh/exec';

const LEAD_CSV_URL  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRSUtXRGORylv3kPfUuzrl9RtNyS-okxqGLqGc7f18aF6H3ycFwNwq-_OlZIUN6QwJVoszvWKwxZNPh/pub?gid=1222820839&single=true&output=csv';
const TRADE_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSqu0fljAyaRMgIgpKO37r9VxiBQJXoBPLZVg8k31u8L5R8vAxtmGqajSFAcZcfL7DWYy449VNfCNsc/pub?gid=1786490570&single=true&output=csv';

// ── 전역 상태 ────────────────────────────────────────────────────────
let _chart       = null;
let _holdingsMap = {};
let _modalState  = { code: '', name: '', price: 0, rate: 0, periodDiv: 'D' };

// ── CSV 파서 ─────────────────────────────────────────────────────────
function parseCsv(text) {
    const rows = [];
    const lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
    for (const line of lines) {
        if (!line.trim()) continue;
        const cols = []; let cur = '', inQ = false;
        for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (ch === '"') { if (inQ && line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ; }
            else if (ch===',' && !inQ) { cols.push(cur.trim()); cur=''; }
            else cur += ch;
        }
        cols.push(cur.trim()); rows.push(cols);
    }
    return rows;
}

// ── 헤더 기반 컬럼맵 (현행 8컬럼 ↔ CLAUDE.md 11컬럼 자동 대응) ─────
function buildLeadColMap(header) {
    const m = {};
    header.forEach((h, i) => { m[h.trim()] = i; });
    const has11 = m['시간'] !== undefined;
    return {
        date:     m['날짜']         ?? 0,
        code:     m['종목코드']     ?? (has11 ? 2 : 1),
        name:     m['종목명']       ?? (has11 ? 3 : 2),
        price:    m['현재가']       ?? m['종가'] ?? (has11 ? 4 : 3),
        rate:     m['등락률']       ?? m['상승률 (%)'] ?? (has11 ? 5 : 4),
        volRatio: m['거래량비']     ?? null,
        amt:      m['거래대금']     ?? m['거래대금 (억)'] ?? (has11 ? 7 : 5),
        inst:     m['기관수급']     ?? null,
        status:   m['매매상태']     ?? null,
        remark:   m['비고']         ?? (has11 ? null : 7),
    };
}

function today() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
// 거래대금 포맷: 억 단위 숫자 → "1조 794억" / "794억"
function formatAmount(val) {
    const n = Math.floor(Number(val) || 0);
    if (n <= 0) return '';
    const jo  = Math.floor(n / 10000);
    const eok = n % 10000;
    if (jo > 0 && eok > 0) return jo + '조 ' + eok + '억';
    if (jo > 0)             return jo + '조';
    return eok + '억';
}

// ── 메인 업데이트 ─────────────────────────────────────────────────────
async function updateDashboard() {
    try {
        const [lRes, tRes] = await Promise.all([fetch(LEAD_CSV_URL), fetch(TRADE_CSV_URL)]);
        if (!lRes.ok) throw new Error('주도주 로딩 실패 (' + lRes.status + ')');
        if (!tRes.ok) throw new Error('매매일지 로딩 실패 (' + tRes.status + ')');

        const leadAll  = parseCsv(await lRes.text());
        const tradeAll = parseCsv(await tRes.text());

        const C         = buildLeadColMap(leadAll[0] || []);
        const leadRows  = leadAll.slice(1);
        const tradeRows = tradeAll.slice(1);

        buildHoldingsMap(tradeRows);
        renderLeadStocks(leadRows, C);
        renderCandidates(leadRows, C);
        renderSummaryTrades(tradeRows);

        document.getElementById('live-status').textContent = '● SYSTEM LIVE';
        document.getElementById('live-status').className   = '';
        document.getElementById('last-update').textContent = 'Last Updated: ' + new Date().toLocaleTimeString('ko-KR');
    } catch (e) {
        console.error(e);
        document.getElementById('live-status').textContent = '● SYNC ERROR';
        document.getElementById('live-status').className   = 'error';
        document.getElementById('last-update').textContent = '로딩 실패: ' + e.message;
    }
}

// ── 보유 종목 맵 구성 ─────────────────────────────────────────────────
function buildHoldingsMap(rows) {
    _holdingsMap = {};
    rows.filter(r => r[1] === '보유').forEach(r => {
        const code = String(r[2] || '').padStart(6, '0');
        _holdingsMap[code] = { buyPrice: parseFloat(r[5]) || 0 };
    });
}

// ── 왼쪽: 관심종목 — 날짜별 그룹, 최신 날짜 최상단, 그룹 내 거래대금 내림차순
function renderLeadStocks(rows, C) {
    const el = document.getElementById('lead-stock-table');
    if (!rows.length || !rows[0][C.date]) {
        document.getElementById('scan-count').textContent = '0';
        el.innerHTML = '<div style="color:var(--sub);font-size:12px;text-align:center;padding:40px 0;">기록된 데이터가 없습니다.</div>';
        return;
    }

    // 날짜별 그룹핑
    const grouped = new Map();
    rows.forEach(r => {
        const d = r[C.date]; if (!d) return;
        if (!grouped.has(d)) grouped.set(d, []);
        grouped.get(d).push(r);
    });

    // 날짜 내림차순 (최신 → 과거)
    const sortedDates = [...grouped.keys()].sort((a, b) => b.localeCompare(a));

    const latestDate  = sortedDates[0] || '';
    const latestCount = latestDate ? grouped.get(latestDate).length : 0;
    document.getElementById('scan-count').textContent = latestCount || '-';
    document.getElementById('lead-badge').textContent = latestDate
        ? latestDate + ' · ' + latestCount + '건' : '최신';

    el.innerHTML = sortedDates.map(date => {
        const group = [...grouped.get(date)].sort((a, b) => (Number(b[C.amt]) || 0) - (Number(a[C.amt]) || 0));

        const rowsHtml = group.map(r => {
            const rate  = parseFloat(r[C.rate])  || 0;
            const price = parseFloat(r[C.price]) || 0;
            const cls   = rate >= 0 ? 'up' : 'down';
            const sign  = rate >= 0 ? '+' : '';
            const amt   = formatAmount(r[C.amt]);
            const code  = esc(r[C.code]);
            const name  = esc(r[C.name]);
            return `<tr onclick="openChartModal('${code}','${name}',${price},${rate})">
                <td>
                    <div>${name}</div>
                    <div class="sub">${code}</div>
                </td>
                <td style="text-align:right; white-space:nowrap;">
                    <span class="${cls}">${sign}${rate.toFixed(2)}%</span>${amt
                        ? ` <span style="color:var(--sub);font-size:11px;margin-left:6px;">${amt}</span>`
                        : ''}
                </td>
                <td>${Number(price).toLocaleString()}원</td>
            </tr>`;
        }).join('');

        return `<div class="date-group">
            <div class="date-group-hdr">📅 ${esc(date)}<span class="dg-line"></span></div>
            <table>${rowsHtml}</table>
        </div>`;
    }).join('');
}

// ── 오른쪽: 눌림목 매매 후보 (3개 전략 섹션) ────────────────────────
function renderCandidates(rows, C) {
    const el = document.getElementById('candidate-sections');

    if (!rows.length) {
        el.innerHTML = '<div class="strat-empty" style="text-align:center;padding:40px 0;">데이터 없음</div>';
        document.getElementById('cand-badge').textContent = '-';
        return;
    }

    const allDates   = rows.map(r => r[C.date]).filter(Boolean);
    const latestDate = allDates.reduce((a,b) => a > b ? a : b, '');

    // NH-Sniper 후보: 최신 날짜 + 등락률 ≤ 3% + 거래량비 ≤ 50%
    const latestPool = rows.filter(r => r[C.date] === latestDate);
    const nhCands = latestPool.filter(r => {
        const rate = parseFloat(r[C.rate]) || 0;
        if (rate > 3.0) return false;
        if (C.volRatio !== null && (parseFloat(r[C.volRatio]) || 999) > 50.0) return false;
        if (C.status !== null) {
            const st = String(r[C.status] || '').trim().toUpperCase();
            if (st && st !== 'PENDING') return false;
        }
        return true;
    });

    document.getElementById('cand-badge').textContent = nhCands.length + '건';

    function makeCandRow(r) {
        const rate = parseFloat(r[C.rate]) || 0;
        const cls  = rate >= 0 ? 'up' : 'down';
        const sign = rate >= 0 ? '+' : '';
        const price = parseFloat(r[C.price]) || 0;
        let instStar = '';
        if (C.inst !== null && parseFloat(r[C.inst]) > 0) instStar = '<span class="star">★</span>';
        else if (C.remark !== null && String(r[C.remark]||'').includes('기관')) instStar = '<span class="star">★</span>';
        return `<tr onclick="openChartModal('${esc(r[C.code])}','${esc(r[C.name])}',${price},${rate})" style="cursor:pointer;">
            <td>
                <div>${esc(r[C.name])}${instStar}</div>
                <div class="sub">${esc(r[C.code])} · <span class="${cls}">${sign}${rate.toFixed(2)}%</span></div>
            </td>
            <td><span class="tag-watch">관심</span></td>
        </tr>`;
    }

    function makeSection(title, badgeText, badgeCls, bodyHtml) {
        return `<div class="strat-section">
            <div class="strat-head">
                <span class="strat-name">${title}</span>
                <span class="badge ${badgeCls}">${badgeText}</span>
            </div>
            ${bodyHtml}
        </div>`;
    }

    // ── 1D-Rebound (예정) ──
    const rb1Body = `<div class="strat-empty">전략 준비 중 — 상세 조건 기술 예정</div>`;

    // ── NH-Sniper (구현 중) ──
    const nhBody = nhCands.length
        ? `<table>${nhCands.map(makeCandRow).join('')}</table>`
        : `<div class="strat-empty">오늘의 NH-Sniper 후보 없음</div>`;

    // ── 20D-Swing (예정) ──
    const swing20Body = `<div class="strat-empty">전략 준비 중 — 20일선 눌림 스윙 조건 기술 예정</div>`;

    el.innerHTML =
        makeSection('1D-Rebound',  '예정',    'badge-planned', rb1Body)    +
        makeSection('NH-Sniper',   '구현 중', 'badge-live',    nhBody)     +
        makeSection('20D-Swing',   '예정',    'badge-planned', swing20Body);
}

// ── 요약 카드: 보유 수 + 이달 수익률 ─────────────────────────────────
function renderSummaryTrades(rows) {
    document.getElementById('holding-count').textContent = rows.filter(r => r[1]==='보유').length;
    const mm   = today().slice(0,7);
    const done = rows.filter(r => r[1]==='완료' && String(r[8]).startsWith(mm));
    if (done.length) {
        const avg = done.reduce((s,r) => s+(parseFloat(r[10])||0), 0) / done.length;
        const el  = document.getElementById('monthly-profit');
        el.textContent = (avg>=0?'+':'') + avg.toFixed(2) + '%';
        el.className   = 'value ' + (avg>=0?'up':'down');
    }
}

// ════════════════════════════════════════════════════════════
// 종목 상세 모달
// ════════════════════════════════════════════════════════════

function openChartModal(code, name, price, rate) {
    _modalState = { code, name, price, rate, periodDiv: 'D' };
    document.getElementById('chart-overlay').style.display = 'flex';

    // CSV 데이터로 헤더 즉시 채우기
    document.getElementById('modal-name').textContent   = name;
    document.getElementById('modal-code').textContent   = code;
    document.getElementById('modal-market').textContent = '-';
    document.getElementById('badge-52h-hdr').innerHTML  = '';

    const pEl = document.getElementById('modal-price');
    const cEl = document.getElementById('modal-change');
    pEl.textContent = price > 0 ? Number(price).toLocaleString() + '원' : '-';
    const sign = rate >= 0 ? '+' : '', cls = rate >= 0 ? 'up' : 'down';
    cEl.innerHTML = `<span class="${cls}">${sign}${Number(rate).toFixed(2)}%</span>`;

    document.getElementById('range-low').textContent  = '52주 최저';
    document.getElementById('range-high').textContent = '52주 최고';
    document.getElementById('range-thumb').style.left = '50%';
    document.getElementById('modal-info-grid').innerHTML   = '<div style="color:var(--sub);font-size:11px;grid-column:span 2">로딩 중...</div>';
    document.getElementById('modal-supply-rows').innerHTML = '<div style="color:var(--sub);font-size:11px">로딩 중...</div>';

    document.querySelectorAll('.chart-tab').forEach(t => t.classList.toggle('active', t.dataset.div === 'D'));
    _destroyChart();
    const msgEl = document.getElementById('chart-msg');
    msgEl.style.display = 'flex';
    msgEl.textContent   = '차트 데이터 로딩 중...';

    // 차트 요청 — 독립 실행 (수급 실패와 무관하게 렌더링)
    fetch(CHART_API_URL + '?type=chart&code=' + encodeURIComponent(code) + '&period=250&period_div=D')
        .then(r => r.json())
        .then(data => {
            if (data.status === 'ok' && (data.chart || []).length) renderChart(data.chart);
            else msgEl.textContent = '차트 데이터 없음' + (data.error ? ': ' + data.error : '');
        })
        .catch(e => { msgEl.textContent = '로딩 실패: ' + e.message; });

    // 종목정보 요청 — 독립 실행 (차트 렌더링과 무관)
    fetch(CHART_API_URL + '?type=stockinfo&code=' + encodeURIComponent(code))
        .then(r => r.json())
        .then(data => {
            if (data.status === 'ok' && data.stockInfo) {
                renderStockHeader(data.stockInfo);
                renderInfoGrid(data.stockInfo);
                renderSupply(data.stockInfo);
            }
        })
        .catch(() => {});  // 수급 실패는 silent — 차트에 영향 없음
}

// ── 탭 전환 (일봉/주봉/월봉) ─────────────────────────────────────────
function switchChartTab(periodDiv) {
    if (_modalState.periodDiv === periodDiv) return;
    _modalState.periodDiv = periodDiv;
    document.querySelectorAll('.chart-tab').forEach(t => t.classList.toggle('active', t.dataset.div === periodDiv));
    _destroyChart();
    const msgEl = document.getElementById('chart-msg');
    msgEl.style.display = 'flex';
    msgEl.textContent   = '차트 데이터 로딩 중...';
    const periods = { D: 250, W: 104, M: 60 };
    fetch(CHART_API_URL + '?type=chart&code=' + encodeURIComponent(_modalState.code)
        + '&period=' + (periods[periodDiv] || 250) + '&period_div=' + periodDiv)
        .then(r => r.json())
        .then(data => {
            if (data.status === 'ok' && (data.chart || []).length) renderChart(data.chart);
            else msgEl.textContent = '차트 데이터 없음';
        })
        .catch(e => { msgEl.textContent = '로딩 실패: ' + e.message; });
}

// ── 헤더 (stockInfo 기반) ────────────────────────────────────────────
function renderStockHeader(info) {
    const price = info.price || _modalState.price;
    const rate  = info.changeRate  || _modalState.rate;
    const chg   = info.priceChange || 0;
    const cls   = rate >= 0 ? 'up' : 'down';
    const sign  = rate >= 0 ? '+' : '';

    document.getElementById('modal-price').textContent = price > 0 ? Number(price).toLocaleString() + '원' : '-';
    document.getElementById('modal-change').innerHTML =
        `<span class="${cls}">${sign}${Number(rate).toFixed(2)}%</span>` +
        (chg !== 0 ? `<span style="color:var(--sub);font-size:13px;margin-left:8px;">${chg > 0 ? '+' : ''}${Number(chg).toLocaleString()}원</span>` : '');

    const mkt   = info.market || '';
    const mktEl = document.getElementById('modal-market');
    mktEl.textContent = mkt || '-';
    mktEl.style.background = mkt.includes('코스닥') ? '#1a1235' : '#1a2535';
    mktEl.style.color      = mkt.includes('코스닥') ? '#a78bfa' : '#3b82f6';

    document.getElementById('badge-52h-hdr').innerHTML =
        (info.high52w > 0 && price >= info.high52w) ? '<span class="badge-52h">52주 신고가</span>' : '';

    if (info.high52w > 0 && info.low52w > 0 && price > 0) {
        const pct = Math.min(100, Math.max(0,
            (price - info.low52w) / (info.high52w - info.low52w) * 100));
        document.getElementById('range-low').textContent  = Number(info.low52w).toLocaleString();
        document.getElementById('range-high').textContent = Number(info.high52w).toLocaleString();
        document.getElementById('range-thumb').style.left = pct.toFixed(1) + '%';
    }
}

// ── 기본정보 그리드 ───────────────────────────────────────────────────
function renderInfoGrid(info) {
    const tv  = Number(info.tradingValue || 0);
    const tvB = tv > 0 ? Math.floor(tv / 1e8) : 0;  // 원 → 억
    const mc  = Number(info.marketCapB  || 0);       // 이미 억원
    let mcStr = '-';
    if (mc > 0) {
        const jo = Math.floor(mc / 10000), eok = mc % 10000;
        mcStr = jo > 0 ? jo + '조' + (eok > 0 ? ' ' + eok + '억' : '') : mc + '억';
    }
    const items = [
        { label: '전일종가',  val: Number(info.prevClose || 0).toLocaleString() + '원' },
        { label: '시가',      val: Number(info.open  || 0).toLocaleString() + '원' },
        { label: '고가',      val: Number(info.high  || 0).toLocaleString() + '원', cls: 'up' },
        { label: '저가',      val: Number(info.low   || 0).toLocaleString() + '원', cls: 'down' },
        { label: '거래량',    val: info.volume > 0 ? Number(info.volume).toLocaleString() + '주' : '-' },
        { label: '거래대금',  val: tvB > 0 ? formatAmount(tvB) : '-' },
        { label: '시가총액',  val: mcStr },
        { label: 'PER / PBR', val: (info.per > 0 ? Number(info.per).toFixed(1) : '-') + ' / ' + (info.pbr > 0 ? Number(info.pbr).toFixed(2) : '-') },
    ];
    document.getElementById('modal-info-grid').innerHTML = items.map(it =>
        `<div class="info-item">
            <span class="info-label">${it.label}</span>
            <span class="info-val${it.cls ? ' ' + it.cls : ''}">${it.val}</span>
        </div>`).join('');
}

// ── 수급 렌더 ─────────────────────────────────────────────────────────
function renderSupply(info) {
    function fmtQ(n) {
        if (!n) return '<span style="color:var(--sub)">-</span>';
        const s = n > 0 ? 'up' : 'down';
        return `<span class="supply-val ${s}">${n > 0 ? '+' : ''}${Number(n).toLocaleString()}주</span>`;
    }
    const parts = [
        info.fnncNet ? '금투 ' + (info.fnncNet > 0 ? '+' : '') + Number(info.fnncNet).toLocaleString() : '',
        info.ivtrNet ? '투신 ' + (info.ivtrNet > 0 ? '+' : '') + Number(info.ivtrNet).toLocaleString() : '',
        info.prvtNet ? '사모 ' + (info.prvtNet > 0 ? '+' : '') + Number(info.prvtNet).toLocaleString() : '',
    ].filter(Boolean);
    const rows = [
        { label: '기관',   net: info.instNet, detail: parts.join(' / ') },
        { label: '외국인', net: info.frnNet,  detail: '' },
        { label: '개인',   net: info.indvNet, detail: '' },
    ];
    document.getElementById('modal-supply-rows').innerHTML = rows.map(r =>
        `<div class="supply-row">
            <span class="supply-label">${r.label}</span>
            <div style="flex:1;text-align:right;">
                ${fmtQ(r.net)}
                ${r.detail ? `<div class="supply-detail">${r.detail}</div>` : ''}
            </div>
        </div>`).join('');
}

// ── 차트 렌더 ─────────────────────────────────────────────────────────
function renderChart(candles) {
    const wrap  = document.getElementById('chart-wrap');
    const msgEl = document.getElementById('chart-msg');
    msgEl.style.display = 'none';

    const div = document.createElement('div');
    div.style.cssText = 'width:100%;height:100%;';
    wrap.appendChild(div);

    _chart = LightweightCharts.createChart(div, {
        width:  div.clientWidth || 852,
        height: 300,
        layout: { background: { color: '#111315' }, textColor: '#8b8e92' },
        grid:   { vertLines: { color: '#1e2124' }, horzLines: { color: '#1e2124' } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        rightPriceScale: { borderColor: '#2a2d31', scaleMargins: { top: 0.08, bottom: 0.25 } },
        timeScale: { borderColor: '#2a2d31', timeVisible: true },
    });

    const fmt = d => `${d.date.slice(0,4)}-${d.date.slice(4,6)}-${d.date.slice(6,8)}`;

    // 캔들스틱
    const cs = _chart.addCandlestickSeries({
        upColor: '#00ffa3', downColor: '#ff4d4d',
        borderVisible: false, wickUpColor: '#00ffa3', wickDownColor: '#ff4d4d',
    });
    cs.setData(candles.map(d => ({ time: fmt(d), open: d.open, high: d.high, low: d.low, close: d.close })));

    // 거래량 오버레이 (하단 25%)
    const volS = _chart.addHistogramSeries({
        priceFormat: { type: 'volume' }, priceScaleId: '',
        lastValueVisible: false, priceLineVisible: false,
    });
    volS.priceScale().applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
    volS.setData(candles.map(d => ({
        time: fmt(d), value: d.volume,
        color: d.close >= d.open ? 'rgba(0,255,163,0.35)' : 'rgba(255,77,77,0.35)',
    })));

    // 이동평균선 MA5/20/60
    const addMA = (p, color) => {
        const s = _chart.addLineSeries({ color, lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
        s.setData(calcMA(candles, p).map((v, i) => ({ time: fmt(candles[i]), value: v })).filter(d => d.value !== null));
    };
    addMA(5,  'rgba(255,255,255,0.70)');
    addMA(20, '#f0a500');
    addMA(60, '#f97316');

    // 52주 신고가 기준선
    const highs = candles.map(d => d.high).filter(v => v > 0);
    if (highs.length > 1) {
        cs.createPriceLine({
            price: Math.max(...highs.slice(0, -1)), color: 'rgba(255,77,77,0.8)', lineWidth: 1,
            lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: '52주 고가',
        });
    }

    // 보유 종목 가격선
    const holding = _holdingsMap[_modalState.code];
    if (holding && holding.buyPrice > 0) {
        const bp = holding.buyPrice;
        cs.createPriceLine({ price: bp,        color: '#00ffa3', lineWidth: 1, lineStyle: 0,                                        axisLabelVisible: true, title: '매수가' });
        cs.createPriceLine({ price: bp * 1.20, color: '#00ffa3', lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: '+20%' });
        cs.createPriceLine({ price: bp * 0.97, color: '#ff4d4d', lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: '-3%' });
    }

    _chart.timeScale().fitContent();
    const onResize = () => { if (_chart) _chart.applyOptions({ width: div.clientWidth }); };
    window.addEventListener('resize', onResize);
    div._onResize = onResize;
}

// ── MA 계산 ──────────────────────────────────────────────────────────
function calcMA(candles, period) {
    return candles.map((_, i) => {
        if (i < period - 1) return null;
        const sum = candles.slice(i - period + 1, i + 1).reduce((s, d) => s + d.close, 0);
        return sum / period;
    });
}

// ── 차트 인스턴스 정리 ────────────────────────────────────────────────
function _destroyChart() {
    if (_chart) {
        const div = document.querySelector('#chart-wrap > div:not(#chart-msg)');
        if (div && div._onResize) window.removeEventListener('resize', div._onResize);
        _chart.remove(); _chart = null;
    }
    Array.from(document.getElementById('chart-wrap').children)
        .forEach(el => { if (el.id !== 'chart-msg') el.remove(); });
}

// ── 모달 닫기 ─────────────────────────────────────────────────────────
function closeChart() {
    document.getElementById('chart-overlay').style.display = 'none';
    _destroyChart();
}

// ESC 키
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeChart(); });
// 오버레이 바깥 클릭
document.getElementById('chart-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeChart();
});

// 초기 로딩 + 60초마다 갱신
updateDashboard();
setInterval(updateDashboard, 60000);
</script>
