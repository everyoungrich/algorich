<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoRich Dashboard</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg:      #0b0c0d;
            --card-bg: #151719;
            --green:   #00ffa3;
            --red:     #ff4d4d;
            --gold:    #f0a500;
            --blue:    #3b82f6;
            --orange:  #f97316;
            --fg:      #ffffff;
            --sub:     #8b8e92;
            --border:  #2a2d31;
            --row:     #1e2124;
        }
        * { box-sizing: border-box; }
        body {
            background: var(--bg); color: var(--fg);
            font-family: 'Pretendard', -apple-system, sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .container { max-width: 1000px; width: 100%; }

        /* ── Header ── */
        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .logo-area { display: flex; flex-direction: column; align-items: flex-start; }
        .logo-img  { height: 45px; width: auto; max-width: 180px; display: block; margin-bottom: 5px; object-fit: contain; }
        #live-status { font-size: 12px; font-weight: bold; color: var(--green); }
        #live-status.error { color: var(--red); }

        /* ── Summary ── */
        .summary-grid {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 15px; margin-bottom: 25px;
        }
        .summary-card {
            background: var(--card-bg); padding: 20px;
            border-radius: 12px; border: 1px solid var(--border);
        }
        .summary-card .label { color: var(--sub); font-size: 12px; margin-bottom: 8px; }
        .summary-card .value { font-size: 24px; font-weight: bold; }

        /* ── Main panels ── */
        .main-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 15px; margin-bottom: 25px;
        }
        .content-card {
            background: var(--card-bg); padding: 20px;
            border-radius: 12px; min-height: 300px; border: 1px solid var(--border);
        }
        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; padding-bottom: 10px;
            border-bottom: 1px solid var(--border); font-size: 14px; font-weight: bold;
        }
        .badge {
            font-size: 10px; padding: 2px 8px; border-radius: 10px;
            background: var(--row); color: var(--sub); font-weight: normal;
        }
        .badge.active { background: #0d2e1f; color: var(--green); }

        /* ── Tables ── */
        table { width: 100%; border-collapse: collapse; }
        td { padding: 10px 0; font-size: 13px; border-bottom: 1px solid var(--row); }
        td:last-child { text-align: right; font-weight: bold; }
        .up   { color: var(--green); }
        .down { color: var(--red); }
        .sub  { color: var(--sub); font-size: 11px; margin-top: 2px; }
        .star { color: var(--gold); font-size: 12px; margin-left: 3px; }
        .msg-row td { color: var(--sub); font-size: 12px; text-align: center; padding: 40px 0; }
        .tag-watch {
            display: inline-block; font-size: 10px; padding: 2px 7px;
            border-radius: 8px; background: #2e2000; color: var(--gold); font-weight: bold;
        }
        /* 관심종목 행 hover */
        #lead-stock-table table tr { cursor: pointer; transition: background 0.15s; }
        #lead-stock-table table tr:hover td { background: #1a1d20; }

        /* 날짜 그룹 헤더 */
        .date-group { margin-top: 16px; }
        .date-group:first-child { margin-top: 0; }
        .date-group-hdr {
            display: flex; align-items: center; gap: 7px;
            padding-bottom: 7px; margin-bottom: 2px;
            font-size: 11px; font-weight: 700;
            color: var(--green); letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
        }
        .date-group-hdr .dg-line {
            flex: 1; height: 1px; background: var(--border);
        }

        /* ── 전략 섹션 ── */
        .strat-section { margin-bottom: 18px; }
        .strat-head {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 8px; padding: 6px 0;
            border-bottom: 1px solid var(--border);
            font-size: 12px; font-weight: bold;
        }
        .strat-name { color: var(--fg); }
        .badge-live    { background: #0d2e1f; color: var(--green); }
        .badge-planned { background: #1e1a0d; color: var(--gold); }
        .strat-empty { color: var(--sub); font-size: 11px; padding: 8px 0 4px 2px; }

        /* ── Footer ── */
        footer {
            margin-top: 40px; padding-top: 20px;
            border-top: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .footer-text { color: var(--sub); font-size: 12px; }

        /* ── Chart Modal ── */
        #chart-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.82);
            z-index: 1000;
            align-items: center; justify-content: center;
        }
        #chart-box {
            background: #111315; border-radius: 16px;
            border: 1px solid var(--border); padding: 24px;
            width: 740px; max-width: 96vw;
        }
        #chart-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 16px;
        }
        #chart-title { font-size: 18px; font-weight: bold; }
        #chart-sub   { font-size: 13px; color: var(--sub); margin-top: 5px; display: flex; align-items: center; gap: 8px; }
        #chart-close {
            background: none; border: none; color: var(--sub);
            font-size: 28px; cursor: pointer; line-height: 1; padding: 0;
        }
        #chart-close:hover { color: var(--fg); }
        #chart-wrap { width: 100%; height: 400px; position: relative; }
        #chart-msg  {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            color: var(--sub); font-size: 13px;
        }
        .badge-52h {
            font-size: 11px; padding: 2px 8px; border-radius: 8px;
            background: rgba(255,77,77,0.15); color: var(--red);
            border: 1px solid rgba(255,77,77,0.3); font-weight: bold;
        }

        @media (max-width: 640px) {
            .summary-grid { grid-template-columns: repeat(2, 1fr); }
            .main-grid    { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">

    <header>
        <div class="logo-area">
            <img src="./logo.png" alt="AlgoRich" class="logo-img"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <h1 style="display:none; color:var(--green); margin:0; font-size:28px;">AlgoRich</h1>
            <p style="color:var(--sub); margin:0; font-size:12px;">algorich.everyoungrich.com</p>
        </div>
        <div id="live-status">● SYSTEM LIVE</div>
    </header>

    <div class="summary-grid">
        <div class="summary-card">
            <div class="label">최근 스캔 주도주</div>
            <div class="value" id="scan-count">-</div>
        </div>
        <div class="summary-card">
            <div class="label">현재 보유 종목</div>
            <div class="value" id="holding-count">-</div>
        </div>
        <div class="summary-card">
            <div class="label">이달 누적 수익률</div>
            <div class="value up" id="monthly-profit">-%</div>
        </div>
        <div class="summary-card">
            <div class="label">알고리즘 상태</div>
            <div class="value" style="font-size:16px; color:var(--green)">NH-Sniper</div>
        </div>
    </div>

    <div class="main-grid">
        <div class="content-card">
            <div class="card-header">
                <span>관심종목 (S-Class 스캔 결과)</span>
                <span class="badge" id="lead-badge">최신 10건</span>
            </div>
            <div id="lead-stock-table">
                <div style="color:var(--sub);font-size:12px;text-align:center;padding:40px 0;">데이터 로딩 중...</div>
            </div>
        </div>
        <div class="content-card">
            <div class="card-header">
                <span>눌림목 매매 후보</span>
                <span class="badge active" id="cand-badge">-</span>
            </div>
            <div id="candidate-sections">
                <div class="strat-empty" style="text-align:center;padding:40px 0;">데이터 로딩 중...</div>
            </div>
        </div>
    </div>

    <footer>
        <div style="display:flex; align-items:center; gap:10px;">
            <img src="./logo.png" alt="AlgoRich" style="height:25px; width:auto; opacity:0.8;"
                 onerror="this.style.display='none';">
            <span class="footer-text"><strong>AlgoRich Dashboard</strong> | Powered by EverYoungRich</span>
        </div>
        <span class="footer-text" id="last-update">업데이트 확인 중...</span>
    </footer>
</div>

<!-- ── 캔들차트 모달 ── -->
<div id="chart-overlay">
    <div id="chart-box">
        <div id="chart-header">
            <div>
                <div id="chart-title"></div>
                <div id="chart-sub"></div>
            </div>
            <button id="chart-close" onclick="closeChart()">×</button>
        </div>
        <div id="chart-wrap">
            <div id="chart-msg">차트 데이터 로딩 중...</div>
        </div>
    </div>
</div>

<script>
// ── 설정 ────────────────────────────────────────────────────────────
// Apps Script 배포 URL — 배포 후 아래에 입력
const CHART_API_URL = 'https://script.google.com/macros/s/AKfycbzLx083Igw4x5jxR2ndLqtpZ_-SeuZALdUXO5qc7EDKEn_nqttruvKrA5cV9RUsPyoh/exec';

const LEAD_CSV_URL  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRSUtXRGORylv3kPfUuzrl9RtNyS-okxqGLqGc7f18aF6H3ycFwNwq-_OlZIUN6QwJVoszvWKwxZNPh/pub?gid=1222820839&single=true&output=csv';
const TRADE_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSqu0fljAyaRMgIgpKO37r9VxiBQJXoBPLZVg8k31u8L5R8vAxtmGqajSFAcZcfL7DWYy449VNfCNsc/pub?gid=1786490570&single=true&output=csv';

// ── 전역 상태 ────────────────────────────────────────────────────────
let _chart       = null;
let _holdingsMap = {};   // { code: { buyPrice } } — 보유 종목 가격선용

// ── CSV 파서 ─────────────────────────────────────────────────────────
function parseCsv(text) {
    const rows = [];
    const lines = text.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
    for (const line of lines) {
        if (!line.trim()) continue;
        const cols = []; let cur = '', inQ = false;
        for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (ch === '"') { if (inQ && line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ; }
            else if (ch===',' && !inQ) { cols.push(cur.trim()); cur=''; }
            else cur += ch;
        }
        cols.push(cur.trim()); rows.push(cols);
    }
    return rows;
}

// ── 헤더 기반 컬럼맵 (현행 8컬럼 ↔ CLAUDE.md 11컬럼 자동 대응) ─────
function buildLeadColMap(header) {
    const m = {};
    header.forEach((h, i) => { m[h.trim()] = i; });
    const has11 = m['시간'] !== undefined;
    return {
        date:     m['날짜']         ?? 0,
        code:     m['종목코드']     ?? (has11 ? 2 : 1),
        name:     m['종목명']       ?? (has11 ? 3 : 2),
        price:    m['현재가']       ?? m['종가'] ?? (has11 ? 4 : 3),
        rate:     m['등락률']       ?? m['상승률 (%)'] ?? (has11 ? 5 : 4),
        volRatio: m['거래량비']     ?? null,
        amt:      m['거래대금']     ?? m['거래대금 (억)'] ?? (has11 ? 7 : 5),
        inst:     m['기관수급']     ?? null,
        status:   m['매매상태']     ?? null,
        remark:   m['비고']         ?? (has11 ? null : 7),
    };
}

function today() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
// 거래대금 포맷: 억 단위 숫자 → "1조 794억" / "794억"
function formatAmount(val) {
    const n = Math.floor(Number(val) || 0);
    if (n <= 0) return '';
    const jo  = Math.floor(n / 10000);
    const eok = n % 10000;
    if (jo > 0 && eok > 0) return jo + '조 ' + eok + '억';
    if (jo > 0)             return jo + '조';
    return eok + '억';
}

// ── 메인 업데이트 ─────────────────────────────────────────────────────
async function updateDashboard() {
    try {
        const [lRes, tRes] = await Promise.all([fetch(LEAD_CSV_URL), fetch(TRADE_CSV_URL)]);
        if (!lRes.ok) throw new Error('주도주 로딩 실패 (' + lRes.status + ')');
        if (!tRes.ok) throw new Error('매매일지 로딩 실패 (' + tRes.status + ')');

        const leadAll  = parseCsv(await lRes.text());
        const tradeAll = parseCsv(await tRes.text());

        const C         = buildLeadColMap(leadAll[0] || []);
        const leadRows  = leadAll.slice(1);
        const tradeRows = tradeAll.slice(1);

        buildHoldingsMap(tradeRows);
        renderLeadStocks(leadRows, C);
        renderCandidates(leadRows, C);
        renderSummaryTrades(tradeRows);

        document.getElementById('live-status').textContent = '● SYSTEM LIVE';
        document.getElementById('live-status').className   = '';
        document.getElementById('last-update').textContent = 'Last Updated: ' + new Date().toLocaleTimeString('ko-KR');
    } catch (e) {
        console.error(e);
        document.getElementById('live-status').textContent = '● SYNC ERROR';
        document.getElementById('live-status').className   = 'error';
        document.getElementById('last-update').textContent = '로딩 실패: ' + e.message;
    }
}

// ── 보유 종목 맵 구성 ─────────────────────────────────────────────────
function buildHoldingsMap(rows) {
    _holdingsMap = {};
    rows.filter(r => r[1] === '보유').forEach(r => {
        const code = String(r[2] || '').padStart(6, '0');
        _holdingsMap[code] = { buyPrice: parseFloat(r[5]) || 0 };
    });
}

// ── 왼쪽: 관심종목 — 날짜별 그룹, 최신 날짜 최상단, 그룹 내 거래대금 내림차순
function renderLeadStocks(rows, C) {
    const el = document.getElementById('lead-stock-table');
    if (!rows.length || !rows[0][C.date]) {
        document.getElementById('scan-count').textContent = '0';
        el.innerHTML = '<div style="color:var(--sub);font-size:12px;text-align:center;padding:40px 0;">기록된 데이터가 없습니다.</div>';
        return;
    }

    // 날짜별 그룹핑
    const grouped = new Map();
    rows.forEach(r => {
        const d = r[C.date]; if (!d) return;
        if (!grouped.has(d)) grouped.set(d, []);
        grouped.get(d).push(r);
    });

    // 날짜 내림차순 (최신 → 과거)
    const sortedDates = [...grouped.keys()].sort((a, b) => b.localeCompare(a));

    const latestDate  = sortedDates[0] || '';
    const latestCount = latestDate ? grouped.get(latestDate).length : 0;
    document.getElementById('scan-count').textContent = latestCount || '-';
    document.getElementById('lead-badge').textContent = latestDate
        ? latestDate + ' · ' + latestCount + '건' : '최신';

    el.innerHTML = sortedDates.map(date => {
        const group = [...grouped.get(date)].sort((a, b) => (Number(b[C.amt]) || 0) - (Number(a[C.amt]) || 0));

        const rowsHtml = group.map(r => {
            const rate  = parseFloat(r[C.rate])  || 0;
            const price = parseFloat(r[C.price]) || 0;
            const cls   = rate >= 0 ? 'up' : 'down';
            const sign  = rate >= 0 ? '+' : '';
            const amt   = formatAmount(r[C.amt]);
            const code  = esc(r[C.code]);
            const name  = esc(r[C.name]);
            return `<tr onclick="openChartModal('${code}','${name}',${price},${rate})">
                <td>
                    <div>${name}</div>
                    <div class="sub">${code}</div>
                </td>
                <td style="text-align:right; white-space:nowrap;">
                    <span class="${cls}">${sign}${rate.toFixed(2)}%</span>${amt
                        ? ` <span style="color:var(--sub);font-size:11px;margin-left:6px;">${amt}</span>`
                        : ''}
                </td>
                <td>${Number(price).toLocaleString()}원</td>
            </tr>`;
        }).join('');

        return `<div class="date-group">
            <div class="date-group-hdr">📅 ${esc(date)}<span class="dg-line"></span></div>
            <table>${rowsHtml}</table>
        </div>`;
    }).join('');
}

// ── 오른쪽: 눌림목 매매 후보 (3개 전략 섹션) ────────────────────────
function renderCandidates(rows, C) {
    const el = document.getElementById('candidate-sections');

    if (!rows.length) {
        el.innerHTML = '<div class="strat-empty" style="text-align:center;padding:40px 0;">데이터 없음</div>';
        document.getElementById('cand-badge').textContent = '-';
        return;
    }

    const allDates   = rows.map(r => r[C.date]).filter(Boolean);
    const latestDate = allDates.reduce((a,b) => a > b ? a : b, '');

    // NH-Sniper 후보: 최신 날짜 + 등락률 ≤ 3% + 거래량비 ≤ 50%
    const latestPool = rows.filter(r => r[C.date] === latestDate);
    const nhCands = latestPool.filter(r => {
        const rate = parseFloat(r[C.rate]) || 0;
        if (rate > 3.0) return false;
        if (C.volRatio !== null && (parseFloat(r[C.volRatio]) || 999) > 50.0) return false;
        if (C.status !== null) {
            const st = String(r[C.status] || '').trim().toUpperCase();
            if (st && st !== 'PENDING') return false;
        }
        return true;
    });

    document.getElementById('cand-badge').textContent = nhCands.length + '건';

    function makeCandRow(r) {
        const rate = parseFloat(r[C.rate]) || 0;
        const cls  = rate >= 0 ? 'up' : 'down';
        const sign = rate >= 0 ? '+' : '';
        const price = parseFloat(r[C.price]) || 0;
        let instStar = '';
        if (C.inst !== null && parseFloat(r[C.inst]) > 0) instStar = '<span class="star">★</span>';
        else if (C.remark !== null && String(r[C.remark]||'').includes('기관')) instStar = '<span class="star">★</span>';
        return `<tr onclick="openChartModal('${esc(r[C.code])}','${esc(r[C.name])}',${price},${rate})" style="cursor:pointer;">
            <td>
                <div>${esc(r[C.name])}${instStar}</div>
                <div class="sub">${esc(r[C.code])} · <span class="${cls}">${sign}${rate.toFixed(2)}%</span></div>
            </td>
            <td><span class="tag-watch">관심</span></td>
        </tr>`;
    }

    function makeSection(title, badgeText, badgeCls, bodyHtml) {
        return `<div class="strat-section">
            <div class="strat-head">
                <span class="strat-name">${title}</span>
                <span class="badge ${badgeCls}">${badgeText}</span>
            </div>
            ${bodyHtml}
        </div>`;
    }

    // ── 1D-Rebound (예정) ──
    const rb1Body = `<div class="strat-empty">전략 준비 중 — 상세 조건 기술 예정</div>`;

    // ── NH-Sniper (구현 중) ──
    const nhBody = nhCands.length
        ? `<table>${nhCands.map(makeCandRow).join('')}</table>`
        : `<div class="strat-empty">오늘의 NH-Sniper 후보 없음</div>`;

    // ── 20D-Swing (예정) ──
    const swing20Body = `<div class="strat-empty">전략 준비 중 — 20일선 눌림 스윙 조건 기술 예정</div>`;

    el.innerHTML =
        makeSection('1D-Rebound',  '예정',    'badge-planned', rb1Body)    +
        makeSection('NH-Sniper',   '구현 중', 'badge-live',    nhBody)     +
        makeSection('20D-Swing',   '예정',    'badge-planned', swing20Body);
}

// ── 요약 카드: 보유 수 + 이달 수익률 ─────────────────────────────────
function renderSummaryTrades(rows) {
    document.getElementById('holding-count').textContent = rows.filter(r => r[1]==='보유').length;
    const mm   = today().slice(0,7);
    const done = rows.filter(r => r[1]==='완료' && String(r[8]).startsWith(mm));
    if (done.length) {
        const avg = done.reduce((s,r) => s+(parseFloat(r[10])||0), 0) / done.length;
        const el  = document.getElementById('monthly-profit');
        el.textContent = (avg>=0?'+':'') + avg.toFixed(2) + '%';
        el.className   = 'value ' + (avg>=0?'up':'down');
    }
}

// ════════════════════════════════════════════════════════════
// 차트 모달
// ════════════════════════════════════════════════════════════
function openChartModal(code, name, price, rate) {
    const overlay = document.getElementById('chart-overlay');
    overlay.style.display = 'flex';

    // 헤더 초기화
    const rateStr = (rate>=0?'+':'') + Number(rate).toFixed(2) + '%';
    const cls     = rate >= 0 ? 'up' : 'down';
    document.getElementById('chart-title').innerHTML =
        `${name} <span style="color:var(--sub);font-size:14px;font-weight:normal;">${code}</span>`;
    document.getElementById('chart-sub').innerHTML =
        `<span>${Number(price).toLocaleString()}원</span>` +
        `<span class="${cls}">${rateStr}</span>`;

    // 기존 차트 제거
    if (_chart) { _chart.remove(); _chart = null; }
    const wrap = document.getElementById('chart-wrap');
    Array.from(wrap.children).forEach(el => { if (el.id !== 'chart-msg') el.remove(); });

    const msgEl = document.getElementById('chart-msg');
    msgEl.style.display = 'flex';
    msgEl.textContent   = '차트 데이터 로딩 중...';

    if (!CHART_API_URL) {
        msgEl.textContent = 'Apps Script URL 미설정 — index.html의 CHART_API_URL에 배포 URL을 입력해주세요.';
        return;
    }

    fetch(CHART_API_URL + '?type=chart&code=' + encodeURIComponent(code) + '&period=250')
        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(data => {
            if (data.status !== 'ok') throw new Error(data.error || '서버 오류');
            const candles = data.chart || [];
            if (!candles.length) throw new Error('차트 데이터 없음');
            renderChart(wrap, msgEl, code, candles, price, rate);
        })
        .catch(e => { msgEl.textContent = '로딩 실패: ' + e.message; });
}

function renderChart(wrap, msgEl, code, candles, currentPrice, rate) {
    msgEl.style.display = 'none';

    const div = document.createElement('div');
    div.style.width  = '100%';
    div.style.height = '100%';
    wrap.appendChild(div);

    _chart = LightweightCharts.createChart(div, {
        width:  div.clientWidth || 692,
        height: 400,
        layout: { background: { color: '#111315' }, textColor: '#8b8e92' },
        grid:   { vertLines: { color: '#1e2124' }, horzLines: { color: '#1e2124' } },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        rightPriceScale: { borderColor: '#2a2d31' },
        timeScale:       { borderColor: '#2a2d31', timeVisible: true },
    });

    // 날짜 변환: YYYYMMDD → YYYY-MM-DD
    const fmt = d => `${d.date.slice(0,4)}-${d.date.slice(4,6)}-${d.date.slice(6,8)}`;

    // ── 캔들스틱 ──
    const cs = _chart.addCandlestickSeries({
        upColor: '#00ffa3', downColor: '#ff4d4d',
        borderVisible: false, wickUpColor: '#00ffa3', wickDownColor: '#ff4d4d',
    });
    cs.setData(candles.map(d => ({ time: fmt(d), open: d.open, high: d.high, low: d.low, close: d.close })));

    // ── 이동평균선 ──
    const addMA = (period, color) => {
        const s = _chart.addLineSeries({ color, lineWidth: 1, priceLineVisible: false, lastValueVisible: false });
        const vals = calcMA(candles, period);
        s.setData(vals.map((v, i) => ({ time: fmt(candles[i]), value: v })).filter(d => d.value !== null));
    };
    addMA(5,  'rgba(255,255,255,0.65)');  // MA5  흰색
    addMA(20, '#f0a500');                  // MA20 노란색
    addMA(60, '#f97316');                  // MA60 주황색

    // ── 52주 고/저 ──
    const highs = candles.map(d => d.high);
    const lows  = candles.map(d => d.low);
    const high52 = Math.max(...highs);
    const low52  = Math.min(...lows);

    cs.createPriceLine({ price: high52, color: '#ff4d4d', lineWidth: 1,
        lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: '52주 고가' });
    cs.createPriceLine({ price: low52, color: '#3b82f6', lineWidth: 1,
        lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: '52주 저가' });

    // ── 52주 신고가 여부 뱃지 ──
    const lastHigh   = candles[candles.length - 1].high;
    const prevHigh52 = Math.max(...highs.slice(0, -1));
    const isNewHigh  = lastHigh >= prevHigh52;
    const subEl      = document.getElementById('chart-sub');
    // 뱃지 중복 제거 후 추가
    const existBadge = subEl.querySelector('.badge-52h');
    if (existBadge) existBadge.remove();
    if (isNewHigh) {
        const badge = document.createElement('span');
        badge.className   = 'badge-52h';
        badge.textContent = '52주 신고가';
        subEl.appendChild(badge);
    }

    // ── 보유 종목 가격선 ──
    const holding = _holdingsMap[code];
    if (holding && holding.buyPrice > 0) {
        const bp = holding.buyPrice;
        cs.createPriceLine({ price: bp,         color: '#00ffa3', lineWidth: 1, lineStyle: 0, axisLabelVisible: true, title: '매수가' });
        cs.createPriceLine({ price: bp * 1.20,  color: '#00ffa3', lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: '목표 +20%' });
        cs.createPriceLine({ price: bp * 0.97,  color: '#ff4d4d', lineWidth: 1, lineStyle: LightweightCharts.LineStyle.Dashed, axisLabelVisible: true, title: '손절 -3%' });
    }

    _chart.timeScale().fitContent();

    // 창 리사이즈 대응
    const onResize = () => {
        if (_chart) _chart.applyOptions({ width: div.clientWidth });
    };
    window.addEventListener('resize', onResize);
    div._onResize = onResize; // cleanup용
}

// ── MA 계산 ──────────────────────────────────────────────────────────
function calcMA(candles, period) {
    return candles.map((_, i) => {
        if (i < period - 1) return null;
        const sum = candles.slice(i - period + 1, i + 1).reduce((s, d) => s + d.close, 0);
        return sum / period;
    });
}

// ── 차트 닫기 ─────────────────────────────────────────────────────────
function closeChart() {
    document.getElementById('chart-overlay').style.display = 'none';
    if (_chart) {
        // resize 리스너 제거
        const div = document.querySelector('#chart-wrap > div:not(#chart-msg)');
        if (div && div._onResize) window.removeEventListener('resize', div._onResize);
        _chart.remove();
        _chart = null;
    }
}

// ESC 키
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeChart(); });
// 오버레이 바깥 클릭
document.getElementById('chart-overlay').addEventListener('click', function(e) {
    if (e.target === this) closeChart();
});

// 초기 로딩 + 60초마다 갱신
updateDashboard();
setInterval(updateDashboard, 60000);
</script>
