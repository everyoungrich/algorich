<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoRich Dashboard</title>
    <style>
        :root {
            --bg-color: #0b0c0d;
            --card-bg: #151719;
            --accent-green: #00ffa3;
            --text-main: #ffffff;
            --text-sub: #8b8e92;
            --red: #ff4d4d;
            --gold: #f0a500;
        }
        * { box-sizing: border-box; }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Pretendard', -apple-system, sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .container { max-width: 1000px; width: 100%; }

        /* Header */
        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; padding-bottom: 10px;
            border-bottom: 1px solid #2a2d31;
        }
        .logo-area { display: flex; flex-direction: column; align-items: flex-start; }
        .logo-img { height: 45px; width: auto; display: block; margin-bottom: 5px; }
        #live-status { font-size: 12px; font-weight: bold; color: var(--accent-green); }
        #live-status.error { color: var(--red); }

        /* Summary Grid */
        .summary-grid {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 15px; margin-bottom: 25px;
        }
        .summary-card {
            background: var(--card-bg); padding: 20px;
            border-radius: 12px; border: 1px solid #2a2d31;
        }
        .summary-card .label { color: var(--text-sub); font-size: 12px; margin-bottom: 8px; }
        .summary-card .value { font-size: 24px; font-weight: bold; }

        /* Main Grid */
        .main-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 15px; margin-bottom: 25px;
        }
        .content-card {
            background: var(--card-bg); padding: 20px;
            border-radius: 12px; min-height: 300px; border: 1px solid #2a2d31;
        }
        .card-header {
            display: flex; justify-content: space-between;
            margin-bottom: 20px; border-bottom: 1px solid #2a2d31;
            padding-bottom: 10px; font-size: 14px; font-weight: bold;
        }
        .badge {
            font-size: 10px; padding: 2px 8px; border-radius: 10px;
            background: #1e2124; color: var(--text-sub); font-weight: normal;
        }
        .badge.active { background: #0d2e1f; color: var(--accent-green); }

        /* Table */
        table { width: 100%; border-collapse: collapse; }
        td { padding: 10px 0; font-size: 13px; border-bottom: 1px solid #1e2124; }
        td:last-child { text-align: right; font-weight: bold; }
        .up   { color: var(--accent-green); }
        .down { color: var(--red); }
        .hold { color: var(--gold); }
        .sub  { color: var(--text-sub); font-size: 11px; margin-top: 2px; }
        .star { color: var(--gold); font-size: 12px; margin-left: 4px; }

        /* Candidate tag */
        .tag-pending {
            display: inline-block; font-size: 10px; padding: 2px 7px;
            border-radius: 8px; background: #0d2e1f; color: var(--accent-green);
            font-weight: bold; letter-spacing: 0.5px;
        }
        .tag-watch {
            display: inline-block; font-size: 10px; padding: 2px 7px;
            border-radius: 8px; background: #2e2000; color: var(--gold);
            font-weight: bold;
        }

        /* Loading / Error */
        .msg-row td { color: var(--text-sub); font-size: 12px; text-align: center; padding: 40px 0; }

        /* Footer */
        footer {
            margin-top: 40px; padding-top: 20px;
            border-top: 1px solid #2a2d31;
            display: flex; justify-content: space-between; align-items: center;
        }
        .footer-text { color: var(--text-sub); font-size: 12px; }

        @media (max-width: 640px) {
            .summary-grid { grid-template-columns: repeat(2, 1fr); }
            .main-grid    { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="container">

    <header>
        <div class="logo-area">
            <img src="./logo.png" alt="AlgoRich" class="logo-img"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
            <h1 style="display:none; color:var(--accent-green); margin:0; font-size:28px;">AlgoRich</h1>
            <p style="color:var(--text-sub); margin:0; font-size:12px;">algorich.everyoungrich.com</p>
        </div>
        <div id="live-status">● SYSTEM LIVE</div>
    </header>

    <div class="summary-grid">
        <div class="summary-card">
            <div class="label">최근 스캔 주도주</div>
            <div class="value" id="scan-count">-</div>
        </div>
        <div class="summary-card">
            <div class="label">현재 보유 종목</div>
            <div class="value" id="holding-count">-</div>
        </div>
        <div class="summary-card">
            <div class="label">이달 누적 수익률</div>
            <div class="value up" id="monthly-profit">-%</div>
        </div>
        <div class="summary-card">
            <div class="label">알고리즘 상태</div>
            <div class="value" style="font-size:16px; color:var(--accent-green)">NH-Sniper</div>
        </div>
    </div>

    <div class="main-grid">
        <!-- 왼쪽: 관심종목 -->
        <div class="content-card">
            <div class="card-header">
                <span>관심종목 (S-Class 스캔 결과)</span>
                <span class="badge" id="lead-badge">최신 10건</span>
            </div>
            <table id="lead-stock-table">
                <tr class="msg-row"><td colspan="3">데이터 로딩 중...</td></tr>
            </table>
        </div>
        <!-- 오른쪽: 눌림목 매매 후보 -->
        <div class="content-card">
            <div class="card-header">
                <span>눌림목 매매 후보</span>
                <span class="badge active" id="cand-badge">NH-Sniper 조건</span>
            </div>
            <table id="candidate-table">
                <tr class="msg-row"><td colspan="2">데이터 로딩 중...</td></tr>
            </table>
        </div>
    </div>

    <footer>
        <div style="display:flex; align-items:center; gap:10px;">
            <img src="./logo.png" alt="AlgoRich" style="height:25px; width:auto; opacity:0.8;"
                 onerror="this.style.display='none';">
            <span class="footer-text"><strong>AlgoRich Dashboard</strong> | Powered by EverYoungRich</span>
        </div>
        <span class="footer-text" id="last-update">업데이트 확인 중...</span>
    </footer>

</div>

<script>
    // ── CSV 공개 URL ────────────────────────────────────────────────────
    const LEAD_CSV_URL  = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRSUtXRGORylv3kPfUuzrl9RtNyS-okxqGLqGc7f18aF6H3ycFwNwq-_OlZIUN6QwJVoszvWKwxZNPh/pub?gid=1222820839&single=true&output=csv';
    const TRADE_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSqu0fljAyaRMgIgpKO37r9VxiBQJXoBPLZVg8k31u8L5R8vAxtmGqajSFAcZcfL7DWYy449VNfCNsc/pub?gid=1786490570&single=true&output=csv';

    // ── CSV 파서 (따옴표·쉼표 포함 필드 대응) ─────────────────────────
    function parseCsv(text) {
        const rows = [];
        const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
        for (const line of lines) {
            if (!line.trim()) continue;
            const cols = [];
            let cur = '', inQuote = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (ch === '"') {
                    if (inQuote && line[i + 1] === '"') { cur += '"'; i++; }
                    else inQuote = !inQuote;
                } else if (ch === ',' && !inQuote) {
                    cols.push(cur.trim()); cur = '';
                } else {
                    cur += ch;
                }
            }
            cols.push(cur.trim());
            rows.push(cols);
        }
        return rows;
    }

    // ── 헤더 → 컬럼 인덱스 맵 ────────────────────────────────────────
    // 실제 시트 헤더(8컬럼): 날짜,종목코드,종목명,종가,상승률 (%),거래대금 (억),거래대금 순위,비고
    // CLAUDE.md 확장 스키마(11컬럼): 날짜,시간,종목코드,종목명,현재가,등락률,거래량비,거래대금,조건,기관수급,매매상태
    function buildLeadColMap(header) {
        const m = {};
        header.forEach((h, i) => { m[h.trim()] = i; });
        return {
            date:       m['날짜']         ?? 0,
            code:       m['종목코드']     ?? (m['시간'] !== undefined ? 2 : 1),
            name:       m['종목명']       ?? (m['시간'] !== undefined ? 3 : 2),
            price:      m['현재가']       ?? m['종가'] ?? (m['시간'] !== undefined ? 4 : 3),
            rate:       m['등락률']       ?? m['상승률 (%)'] ?? (m['시간'] !== undefined ? 5 : 4),
            volRatio:   m['거래량비']     ?? null,
            amt:        m['거래대금']     ?? m['거래대금 (억)'] ?? (m['시간'] !== undefined ? 7 : 5),
            inst:       m['기관수급']     ?? null,
            status:     m['매매상태']     ?? null,
            remark:     m['비고']         ?? (m['시간'] !== undefined ? null : 7),
        };
    }

    // ── 유틸 ─────────────────────────────────────────────────────────
    function today() {
        const d = new Date();
        return d.getFullYear() + '-' +
               String(d.getMonth() + 1).padStart(2, '0') + '-' +
               String(d.getDate()).padStart(2, '0');
    }
    function esc(str) {
        return String(str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // ── 메인 업데이트 ─────────────────────────────────────────────────
    async function updateDashboard() {
        try {
            const [leadRes, tradeRes] = await Promise.all([
                fetch(LEAD_CSV_URL),
                fetch(TRADE_CSV_URL)
            ]);
            if (!leadRes.ok)  throw new Error('주도주 Log 로딩 실패 (' + leadRes.status + ')');
            if (!tradeRes.ok) throw new Error('매매일지 로딩 실패 (' + tradeRes.status + ')');

            const leadAll   = parseCsv(await leadRes.text());
            const tradeAll  = parseCsv(await tradeRes.text());

            const leadHeader = leadAll[0] || [];
            const leadRows   = leadAll.slice(1);
            const tradeRows  = tradeAll.slice(1);

            const C = buildLeadColMap(leadHeader);

            renderLeadStocks(leadRows, C);
            renderCandidates(leadRows, C);
            renderSummaryTrades(tradeRows);

            document.getElementById('live-status').textContent = '● SYSTEM LIVE';
            document.getElementById('live-status').className   = '';
            document.getElementById('last-update').textContent =
                'Last Updated: ' + new Date().toLocaleTimeString('ko-KR');

        } catch (e) {
            console.error('Data Sync Error:', e);
            document.getElementById('live-status').textContent = '● SYNC ERROR';
            document.getElementById('live-status').className   = 'error';
            document.getElementById('last-update').textContent = '로딩 실패: ' + e.message;
        }
    }

    // ── 왼쪽: 관심종목 (S-Class 스캔 결과) — 최신 10건 ──────────────
    function renderLeadStocks(rows, C) {
        if (!rows.length || !rows[0][C.date]) {
            document.getElementById('scan-count').textContent = '0';
            document.getElementById('lead-stock-table').innerHTML =
                '<tr class="msg-row"><td colspan="3">기록된 데이터가 없습니다.</td></tr>';
            return;
        }

        // 최근 스캔일 기준으로 건수 집계
        const allDates  = rows.map(r => r[C.date]).filter(Boolean);
        const latestDate = allDates.reduce((a, b) => (a > b ? a : b), '');
        const latestRows = rows.filter(r => r[C.date] === latestDate);

        document.getElementById('scan-count').textContent = latestRows.length || '-';
        document.getElementById('lead-badge').textContent =
            latestDate ? latestDate + ' · ' + latestRows.length + '건' : '최신 10건';

        // 최신 10건 (전체 기준)
        const display = rows.slice(-10).reverse();

        document.getElementById('lead-stock-table').innerHTML = display.map(r => {
            const rate = parseFloat(r[C.rate]) || 0;
            const cls  = rate >= 0 ? 'up' : 'down';
            const sign = rate >= 0 ? '+' : '';
            const price = Number(r[C.price] || 0).toLocaleString();
            const amt   = r[C.amt] ? Number(r[C.amt]).toLocaleString() + '억' : '-';
            return `<tr>
                <td>
                    <div>${esc(r[C.name])}</div>
                    <div class="sub">${esc(r[C.code])} &middot; ${esc(r[C.date])}</div>
                </td>
                <td class="${cls}" style="text-align:center; white-space:nowrap;">
                    ${sign}${rate.toFixed(2)}%<br>
                    <span class="sub" style="font-weight:normal">${amt}</span>
                </td>
                <td>
                    <div>${price}원</div>
                </td>
            </tr>`;
        }).join('');
    }

    // ── 오른쪽: 눌림목 매매 후보 ──────────────────────────────────────
    // 조건: 등락률 ≤ 3% (+ 거래량비 ≤ 50%, 기관수급 — 컬럼 있으면 자동 적용)
    function renderCandidates(rows, C) {
        if (!rows.length) {
            document.getElementById('candidate-table').innerHTML =
                '<tr class="msg-row"><td colspan="2">오늘의 매매 후보가 없습니다.</td></tr>';
            return;
        }

        // 최신 스캔일 종목만 대상
        const allDates   = rows.map(r => r[C.date]).filter(Boolean);
        const latestDate = allDates.reduce((a, b) => (a > b ? a : b), '');
        let pool = rows.filter(r => r[C.date] === latestDate);
        if (!pool.length) pool = rows.slice(-10);

        const candidates = pool.filter(r => {
            const rate = parseFloat(r[C.rate]) || 0;
            if (rate > 3.0) return false;

            // 거래량비 컬럼이 있으면 추가 필터
            if (C.volRatio !== null) {
                const vr = parseFloat(r[C.volRatio]) || 999;
                if (vr > 50.0) return false;
            }

            // 매매상태 컬럼이 있으면 PENDING만
            if (C.status !== null) {
                const st = String(r[C.status] || '').trim().toUpperCase();
                if (st && st !== 'PENDING') return false;
            }

            return true;
        });

        if (!candidates.length) {
            document.getElementById('cand-badge').textContent = '0건';
            document.getElementById('candidate-table').innerHTML =
                '<tr class="msg-row"><td colspan="2">오늘의 매매 후보가 없습니다.</td></tr>';
            return;
        }

        document.getElementById('cand-badge').textContent = candidates.length + '건';

        document.getElementById('candidate-table').innerHTML = candidates.map(r => {
            const rate = parseFloat(r[C.rate]) || 0;
            const cls  = rate >= 0 ? 'up' : 'down';
            const sign = rate >= 0 ? '+' : '';

            // 기관수급 ★
            let instStar = '';
            if (C.inst !== null) {
                const instVal = parseFloat(r[C.inst]) || 0;
                if (instVal > 0) instStar = '<span class="star">★</span>';
            } else if (C.remark !== null) {
                // 비고 컬럼에 '기관' 포함 시 ★
                const rem = String(r[C.remark] || '');
                if (rem.includes('기관')) instStar = '<span class="star">★</span>';
            }

            // 거래량비 표시
            let volLabel = '';
            if (C.volRatio !== null) {
                const vr = parseFloat(r[C.volRatio]) || 0;
                volLabel = ` · 거래량 ${vr.toFixed(0)}%`;
            }

            const statusTag = C.status !== null
                ? `<span class="tag-pending">${esc(r[C.status] || 'PENDING')}</span>`
                : `<span class="tag-watch">관심</span>`;

            return `<tr>
                <td>
                    <div>${esc(r[C.name])}${instStar}</div>
                    <div class="sub">${esc(r[C.code])} &middot; <span class="${cls}">${sign}${rate.toFixed(2)}%</span>${volLabel}</div>
                </td>
                <td>${statusTag}</td>
            </tr>`;
        }).join('');
    }

    // ── 요약 카드: 보유 종목 수 + 이달 수익률 (매매일지 기반) ─────────
    function renderSummaryTrades(rows) {
        const holding = rows.filter(r => r[1] === '보유');
        document.getElementById('holding-count').textContent = holding.length;

        const thisMonth = today().slice(0, 7);
        const monthDone = rows.filter(r => r[1] === '완료' && String(r[8]).startsWith(thisMonth));
        if (monthDone.length > 0) {
            const avg = monthDone.reduce((s, r) => s + (parseFloat(r[10]) || 0), 0) / monthDone.length;
            const el  = document.getElementById('monthly-profit');
            el.textContent = (avg >= 0 ? '+' : '') + avg.toFixed(2) + '%';
            el.className   = 'value ' + (avg >= 0 ? 'up' : 'down');
        } else {
            document.getElementById('monthly-profit').textContent = '-%';
        }
    }

    // 최초 로딩 + 60초마다 자동 갱신
    updateDashboard();
    setInterval(updateDashboard, 60000);
</script>
</body>
</html>
